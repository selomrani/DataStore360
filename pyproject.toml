[project]
name = "datastore360"
version = "0.1.0"
description = "Pipeline ETL DataStore360 : fiabilisation, RGPD, PostgreSQL & Airflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "ydata-profiling>=4.6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "apache-airflow>=2.8.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
